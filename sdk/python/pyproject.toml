[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhms"
version = "0.1.0"
description = "BHMS (Bud HMS): a JSON-RPC 2.0 protocol for AI agents operating physical devices"
requires-python = ">=3.11"
dependencies = [
  "orjson",
  "pydantic>=2",
  "websockets",
  "typer",
  "rich",
  "jsonschema",
  "rfc8785",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<3", "uvicorn", "starlette"]
http = ["aiohttp>=3.9"]
sim = []
openai = ["openai>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
bhms = "bhms.cli.main:app"

[tool.setuptools.package-data]
# bhms/protocol/bhms.schema.json is a symlink to spec/bhms/schema/bhms.schema.json (one source file); likewise
# bhms/conformance/vectors -> spec/bhms/conformance/vectors.
bhms = ["protocol/bhms.schema.json", "templates/new/*.tmpl", "conformance/requirements.json", "conformance/vectors/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
testpaths = ["tests"]
